[project]
name = "jailbreak-hermes"
version = "0.1.0"
description = "Authorized multilingual safety-evaluation harness for English vs Romanized-Hindi refusal inconsistencies. Inspired by NousResearch/hermes-agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "dspy>=2.6",
]

[project.scripts]
jbh = "jailbreak_hermes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jailbreak_hermes"]

[tool.pytest.ini_options]
# Historical checkouts and temporary fixtures are evidence, not the active suite.
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
analysis = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scipy>=1.15",
    "statsmodels>=0.14",
]
